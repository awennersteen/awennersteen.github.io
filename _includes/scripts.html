<script>
  document
    .querySelectorAll(".page__content img, .page__hero-image")
    .forEach(function(image) {
      if (image.closest("a")) return;

      var link = document.createElement("a");
      link.href = image.src;
      link.className = "image-popup";
      link.setAttribute("aria-label", "Open image at full size");
      image.parentNode.insertBefore(link, image);
      link.appendChild(image);
    });
</script>
<script src="{{ base_path }}/assets/js/main.min.js"></script>
{% if page.collection == "posts" %}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  document
    .querySelectorAll("pre > code.language-mermaid")
    .forEach((codeBlock) => {
      const preElement = codeBlock.parentElement;
      const mermaidElement = document.createElement("pre");
      mermaidElement.className = "mermaid";
      mermaidElement.textContent = codeBlock.textContent;
      preElement.replaceWith(mermaidElement);
    });

  mermaid.initialize({
    startOnLoad: false,
    theme: "neutral",
    themeVariables: {
      fontFamily: "system-ui, -apple-system, sans-serif",
      primaryColor: "#f3f4f6",
      primaryTextColor: "#1f2937",
      primaryBorderColor: "#d1d5db",
      lineColor: "#4b5563",
      secondaryColor: "#e5e7eb",
      tertiaryColor: "#f9fafb",
    },
    flowchart: {
      htmlLabels: true,
      curve: "basis",
    },
  });

  mermaid.run();
</script>
{% endif %}
